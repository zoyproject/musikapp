name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Musicplay FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Musicplay
      METROLIST_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug, O=Android, C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/foss/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not produced."
            exit 1
          fi
          echo "Debug APK: $APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: musicplay-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
