name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METROLIST_APP_NAME: Musicplay
      METROLIST_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --no-daemon

      - name: Verify APK
        run: |
          test -n "$(find app/build/outputs/apk/foss/debug -name '*.apk' -print -quit)"
          find app/build/outputs/apk/foss/debug -name '*.apk' -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicplay-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
